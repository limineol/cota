name: CI

on:
  push:
    branches: [main]
  pull_request:

# A run takes over an hour, so a newer push to the same branch or pull request
# stops the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The request log's tests run against this ClickHouse, as against
    # compose.dev.yaml's: the same image, user and throwaway password.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
        env:
          CLICKHOUSE_DB: cota
          CLICKHOUSE_USER: cota
          CLICKHOUSE_PASSWORD: throwaway-dev-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 18123:8123
        options: >-
          --health-cmd "clickhouse-client --user cota --password throwaway-dev-password --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The stories gate runs every story in Playwright's Chromium (ADR-0020).
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tooling/bend.ts') }}
      - run: bun run verify -- --verdict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence
          path: evidence/

  # `cota` for the five systems, each started on its own (ADR-0027): the same
  # workflow the release publishes from.
  binaries:
    permissions:
      contents: read
    uses: ./.github/workflows/binaries.yml

  # The hub image for both platforms of ADR-0024, built and kept nowhere: the
  # release workflow publishes it, on a tag the owner pushes (ADR-0027). The
  # verify job's slow tier builds the image for the runner's platform and runs it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --build-arg COTA_REVISION=${{ github.sha }}
          --output type=cacheonly
          .
