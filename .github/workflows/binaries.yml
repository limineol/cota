name: Binaries

# `cota` for the five systems of ADR-0022, built on one Linux runner and each
# started on a runner of its own system (ADR-0027). CI calls it for every pull
# request and push to main; the release calls it and publishes what it built.
on:
  workflow_call:
    outputs:
      version:
        description: The version `cota --version` printed on every system
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run cli:build -- --all
      - id: version
        run: echo "version=$(bun -p 'require("./apps/cli/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cota
          path: apps/cli/dist/cota-*
          if-no-files-found: error

  # A cross-compiled binary is only shown to start by starting it where it
  # runs: macOS on arm64 kills a Mach-O whose signature does not cover it.
  start:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: cota-linux-x64
            runner: ubuntu-24.04
          - file: cota-linux-arm64
            runner: ubuntu-24.04-arm
          - file: cota-darwin-arm64
            runner: macos-15
          - file: cota-darwin-x64
            runner: macos-15-intel
          - file: cota-windows-x64.exe
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cota
      # An artifact keeps no file modes, so the binary is made executable again.
      - shell: bash
        env:
          FILE: ${{ matrix.file }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          chmod +x "./$FILE"
          printed="$("./$FILE" --version)"
          if [ "$printed" != "$VERSION" ]; then
            echo "::error::$FILE --version printed '$printed', not $VERSION"
            exit 1
          fi
          echo "$FILE --version printed $printed"
