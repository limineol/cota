name: cota-dev

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_DB: cota
      CLICKHOUSE_USER: cota
      CLICKHOUSE_PASSWORD: throwaway-dev-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "cota",
          "--password",
          "throwaway-dev-password",
          "--query",
          "SELECT 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  clickhouse:
